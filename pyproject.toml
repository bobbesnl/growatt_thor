[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Changing Enum string formatting or runtime type-alias objects is not formatting.
ignore = ["UP040", "UP042"]

[tool.mypy]
python_version = "3.12"
mypy_path = "tests/typing_stubs"
explicit_package_bases = true
strict = true
# Inspect dependency signatures while rolling out strict checks package by package.
follow_imports = "silent"
files = [
    "custom_components/growatt_thor/coerce.py",
    "custom_components/growatt_thor/coordinator.py",
    "custom_components/growatt_thor/entity.py",
    "custom_components/growatt_thor/sensor.py",
    "custom_components/growatt_thor/sensor_descriptions.py",
    "custom_components/growatt_thor/number.py",
    "custom_components/growatt_thor/select.py",
    "custom_components/growatt_thor/switch.py",
    "custom_components/growatt_thor/time.py",
    "custom_components/growatt_thor/button.py",
    "custom_components/growatt_thor/charging/",
    "custom_components/growatt_thor/runtime/",
    "custom_components/growatt_thor/ocpp/",
    "custom_components/growatt_thor/configuration/",
    "custom_components/growatt_thor/energy/",
    "custom_components/growatt_thor/timestamps.py",
    "custom_components/growatt_thor/sessions/",
    "custom_components/growatt_thor/presentation/card_data.py",
    "custom_components/growatt_thor/presentation/battery.py",
    "custom_components/growatt_thor/presentation/contracts.py",
    "tests/typing/owner_contracts.py",
    "tests/test_layer_boundaries.py",
    "scripts/",
    "custom_components/growatt_thor/targets/model.py",
    "custom_components/growatt_thor/targets/requests.py",
]

[[tool.mypy.overrides]]
module = ["homeassistant.*", "voluptuous", "voluptuous.*", "voluptuous_serialize", "ocpp.*"]
ignore_missing_imports = true

# Read by scripts/check_size_budgets.py. CI reports overruns as warnings.
[tool.growatt_thor.size_budgets]
max_file_lines = 600
max_function_lines = 60
python = ["custom_components"]
typescript = ["frontend/src"]
