refresh:
  name: Refresh data
  description: Manually refresh all data from the charger. Leave the charger empty to refresh every configured charger.
  fields:
    config_entry_id:
      name: Charger
      description: The Growatt THOR config entry to refresh. Empty means all.
      required: false
      selector:
        config_entry:
          integration: growatt_thor

export_sessions:
  name: Export charging sessions
  description: Export charging sessions within a date range to a CSV file
  fields:
    date_from:
      name: Start date
      description: First session date to include in the export
      required: true
      selector:
        date:
    date_to:
      name: End date
      description: Last session date to include in the export
      required: true
      selector:
        date:
