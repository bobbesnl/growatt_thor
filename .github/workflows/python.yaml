name: Python
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-auth.txt
      - run: python -m pip install -r tests/requirements-auth.txt
      - run: python -m unittest discover -s tests -q
