name: Python
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-auth.txt
      - run: python -m pip install -r tests/requirements-auth.txt
      - run: python -m pip install ruff==0.17.3
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m mypy
      - name: Tests with coverage
        run: |
          python -m pytest --cov --cov-report=term --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"
      - name: Size budgets (warning only)
        run: python scripts/check_size_budgets.py
  home-assistant:
    # Real Home Assistant in its own environment: the unit suites replace
    # homeassistant with stand-ins and cannot share a process with it.
    name: Home Assistant ${{ matrix.stack }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: min
            python-version: '3.12'
          - stack: latest
            python-version: '3.14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tests_ha/requirements-${{ matrix.stack }}.txt
      - run: python -m pip install -r tests_ha/requirements-${{ matrix.stack }}.txt
      - run: python -m pytest -c tests_ha/pytest.ini --rootdir=. tests_ha
