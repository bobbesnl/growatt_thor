name: Frontend
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git diff --exit-code -- custom_components/growatt_thor/frontend/thor-card.js frontend/preview/ha-icon.bundle.js frontend/preview/goal-panel.bundle.js frontend/preview/LICENSE-MDI
